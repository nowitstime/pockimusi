name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Run Lua test suite
        run: luajit tests/run.lua

      - name: Build Pockimusi.love
        run: python3 build.py

      - name: Upload Pockimusi.love artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pockimusi.love
          path: pockimusi/Pockimusi.love
